name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Go version
        run: go version
      - name: Go format
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            printf 'Unformatted Go files:\n%s\n' "$UNFORMATTED" >&2
            exit 1
          fi
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./cmd/upctl
      - name: Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          LUA_COMPILER="$(command -v luac5.4 || command -v luac)"
          test -n "$LUA_COMPILER"
          find 'resources/[up]' -name '*.lua' -print0 | xargs -0 -n1 "$LUA_COMPILER" -p
          find tests/lua -name '*_spec.lua' -print0 | xargs -0 -n1 lua5.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Entry web
        working-directory: resources/[up]/up_entry/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- dist
      - name: Compose validation
        run: docker compose -f infra/compose.dev.yml config
      - name: MySQL migration integration
        run: |
          docker compose -f infra/compose.dev.yml down -v
          docker compose -f infra/compose.dev.yml up -d --wait mysql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up < database/migrations/0001_core.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up < database/migrations/0002_character_lifecycle.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uup -pup-local-only up \
            -e "SELECT version, name FROM up_core_schema_migrations WHERE version IN (1, 2) ORDER BY version;"
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uup -pup-local-only up < tests/sql/character_lifecycle.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uup -pup-local-only up < tests/sql/character_transactions.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uup -pup-local-only up < tests/sql/identity_security.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only -e "CREATE DATABASE up_upgrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up_upgrade < database/migrations/0001_core.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up_upgrade < tests/sql/upgrade_v1_fixture.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up_upgrade < database/migrations/0002_character_lifecycle.sql
          docker compose -f infra/compose.dev.yml exec -T mysql \
            mysql -uroot -proot-local-only up_upgrade < tests/sql/upgrade_v2_assertions.sql
      - name: Compose cleanup
        if: always()
        run: docker compose -f infra/compose.dev.yml down -v
