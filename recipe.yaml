$engine: 3
$onesync: on

name: UP - Universo Paralelo
version: 0.1.0-dev
author: lisboon
description: Clean-room UP development foundation

tasks:
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: 32d98e7524b952faf8b220d719615b0346b0a6cc
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: download_github
    src: https://github.com/lisboon/UP-Framework
    ref: feat/up-foundation
    dest: ./tmp/up

  - action: move_path
    src: ./tmp/up/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/up/permissions.cfg
    dest: ./permissions.cfg

  - action: move_path
    src: ./tmp/up/common.cfg
    dest: ./common.cfg

  - action: move_path
    src: ./tmp/up/resources/[up]
    dest: ./resources/[up]

  - action: move_path
    src: ./tmp/up/resources/[up-scripts]
    dest: ./resources/[up-scripts]

  - action: connect_database

  - action: query_database
    file: ./tmp/up/database/migrations/0001_core.sql

  - action: query_database
    file: ./tmp/up/database/migrations/0002_character_lifecycle.sql

  - action: remove_path
    path: ./tmp/up
